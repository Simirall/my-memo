name: Merge verified Dependabot updates

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Dependabot PR to verify and merge, or recover main verification after merging
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  merge:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: dependabot-merge-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}
      cancel-in-progress: false
    steps:
      # 書き込み権限を持つジョブでは、PR側のコードを取得・実行しない。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Update, verify and merge the Dependabot pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: mergeDependabot } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/merge-dependabot.mjs`);
            await mergeDependabot({ github, context, core });
