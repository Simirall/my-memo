name: Deploy

on:
  workflow_call:
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://my-memo.partial.cc
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Check latest main commit
        id: current
        shell: bash
        run: |
          git fetch origin main --depth=1
          if [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale commit $(git rev-parse HEAD)"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.current.outputs.deploy == 'true'
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false
      - if: steps.current.outputs.deploy == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - if: steps.current.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.current.outputs.deploy == 'true'
        run: pnpm run build
      - name: Apply D1 migrations
        if: steps.current.outputs.deploy == 'true'
        run: pnpm run db:remote:migrate
      - name: Deploy Worker
        if: steps.current.outputs.deploy == 'true'
        run: pnpm exec wrangler deploy --keep-vars
      - name: Verify production login page
        if: steps.current.outputs.deploy == 'true'
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors https://my-memo.partial.cc/login > /dev/null
